name: CI

on:
  push:
    branches: [main]   # feature branches are covered by the pull_request trigger
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# One run per ref; a newer push cancels an in-flight run on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · type · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The test tier hits a real agent against the configured model
      # (settings.agent_model, qwen2.5:0.5b — a tiny instruct model). Pin it here
      # so the model we pull below matches app/core/config.py. The slow tier
      # stays deselected in CI by pyproject's `addopts = -m 'not slow'`.
      CLEARTERMS_AGENT_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12"   # match backend/Dockerfile's pinned uv

      - name: Sync deps
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy .

      # --- Ollama: the test agent is real, just tiny (no fakes by design) ---

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.CLEARTERMS_AGENT_MODEL }}

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          # Wait for the HTTP API before pulling; fail fast if it never comes up.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is up"; exit 0
            fi
            sleep 1
          done
          echo "Ollama did not become ready in time" >&2; exit 1

      - name: Pull model
        run: ollama pull "$CLEARTERMS_AGENT_MODEL"

      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22   # match frontend/Dockerfile + .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck gate)
        run: npm run build

  images:
    name: Images (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only — no registry push, no deploy. Catches a broken Dockerfile or
      # nginx.conf before it reaches a deploy. No Ollama/db needed for a build.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
