services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clearterms
      POSTGRES_PASSWORD: clearterms
      POSTGRES_DB: clearterms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearterms -d clearterms"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API (presigned URLs hit this from the browser)
      - "9001:9001"   # MinIO console — http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/clearterms-media &&
        mc anonymous set download local/clearterms-media
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Reach the db service by name; container-to-container, so port 5432 not localhost.
      CLEARTERMS_DATABASE_URL: postgresql+asyncpg://clearterms:clearterms@db:5432/clearterms
      CLEARTERMS_OLLAMA_BASE_URL: http://host.docker.internal:11434
      # MinIO — internal endpoint for backend put/get; public endpoint for presigned URLs
      CLEARTERMS_S3_ENDPOINT_URL: http://minio:9000
      CLEARTERMS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    extra_hosts:
      # Let the container reach an Ollama running on the host.
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  minio_data:
