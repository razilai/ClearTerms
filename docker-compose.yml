services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clearterms
      POSTGRES_PASSWORD: clearterms
      POSTGRES_DB: clearterms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearterms -d clearterms"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Reach the db service by name; container-to-container, so port 5432 not localhost.
      CLEARTERMS_DATABASE_URL: postgresql+asyncpg://clearterms:clearterms@db:5432/clearterms
      CLEARTERMS_OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Let the container reach an Ollama running on the host.
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
