services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clearterms
      POSTGRES_PASSWORD: clearterms
      POSTGRES_DB: clearterms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearterms -d clearterms"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API (presigned URLs hit this from the browser)
      - "9001:9001"   # MinIO console — http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/clearterms-media &&
        mc anonymous set download local/clearterms-media
      "

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
    # GPU passthrough (NVIDIA): uncomment to run the model on GPU instead of CPU.
    # Needs the NVIDIA Container Toolkit on the host. CPU works out of the box but
    # is slow for a 4B model.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pull the model the agent uses (must match backend agent_model /
  # model_version in app/core/config.py). Bump both when you change the model.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull qwen3:4b"]

  # One-shot: pull the tiny model the non-slow test tier uses (conftest.py
  # LIGHT_MODEL / CLEARTERMS_TEST_AGENT_MODEL). Kept separate from the prod pull
  # so `docker compose up` yields a test-ready Ollama; tests run on the host and
  # reach it via the exposed :11434. Bump alongside conftest's LIGHT_MODEL.
  ollama-pull-test:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:0.5b"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Reach the db service by name; container-to-container, so port 5432 not localhost.
      CLEARTERMS_DATABASE_URL: postgresql+asyncpg://clearterms:clearterms@db:5432/clearterms
      # Reach Ollama by service name now that it runs in the compose graph.
      CLEARTERMS_OLLAMA_BASE_URL: http://ollama:11434
      # MinIO — internal endpoint for backend put/get; public endpoint for presigned URLs
      CLEARTERMS_S3_ENDPOINT_URL: http://minio:9000
      CLEARTERMS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-pull:
        # Wait for the model to be present before serving, so the first analyze
        # doesn't hit a missing-model error.
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"   # http://localhost:5173 — matches the dev port
    depends_on:
      - backend

volumes:
  pgdata:
  minio_data:
  ollama_data:
