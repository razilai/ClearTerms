services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearterms
      # Required — no dev default. Supplied from repo-root .env / host env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (e.g. openssl rand -hex 32)}
      POSTGRES_DB: clearterms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearterms -d clearterms"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Pinned (not :latest) for reproducible builds — bump deliberately.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clearterms}
      # Required — no dev default. Supplied from repo-root .env / host env.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD (e.g. openssl rand -hex 32)}
    ports:
      - "9000:9000"   # S3 API (presigned URLs hit this from the browser)
      - "9001:9001"   # MinIO console — http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clearterms}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD (e.g. openssl rand -hex 32)}
    # Alias uses the same creds as the server so the bucket setup authenticates.
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
        mc mb --ignore-existing local/clearterms-media &&
        mc anonymous set download local/clearterms-media
      "

  ollama:
    # Pinned by digest (no clean semver tag published) — client version 0.32.6.
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10

    # GPU passthrough (NVIDIA): uncomment to run the model on GPU instead of CPU.
    # Needs a GPU VM size (Azure NC/ND/NV) plus the NVIDIA driver and Container
    # Toolkit on the host — otherwise compose fails with 'could not select device
    # driver "nvidia"'. The group VM (Standard_E4ads_v5) has no GPU, so this stays
    # commented; CPU works out of the box and is fine for the 0.5B model.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pull the model the agent uses (must match backend agent_model /
  # model_version in app/core/config.py). Bump both when you change the model.
  # This is also the model the non-slow test tier runs on, so a plain
  # `docker compose up` yields a test-ready Ollama; tests run on the host and
  # reach it via the exposed :11434.
  ollama-pull:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:0.5b"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Real deployment: hardens startup (see core/config.py::_guard_prod_secrets),
      # which forces a real JWT secret below.
      CLEARTERMS_ENVIRONMENT: prod
      # Supplied from the host env / repo-root .env, never baked into the image.
      # >=32 bytes; generate with: openssl rand -hex 32. Compose errors if unset.
      CLEARTERMS_JWT_SECRET: ${CLEARTERMS_JWT_SECRET:?set CLEARTERMS_JWT_SECRET (>=32 bytes, e.g. openssl rand -hex 32)}
      # Reach the db service by name; container-to-container, so port 5432 not localhost.
      # Password comes from the same POSTGRES_PASSWORD the db service requires.
      CLEARTERMS_DATABASE_URL: postgresql+asyncpg://clearterms:${POSTGRES_PASSWORD}@db:5432/clearterms
      # Reach Ollama by service name now that it runs in the compose graph.
      CLEARTERMS_OLLAMA_BASE_URL: http://ollama:11434
      # MinIO — internal endpoint for backend put/get; public endpoint for presigned URLs.
      CLEARTERMS_S3_ENDPOINT_URL: http://minio:9000
      CLEARTERMS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      # Use the MinIO root creds explicitly — don't fall through to config.py defaults.
      CLEARTERMS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-clearterms}
      CLEARTERMS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-pull:
        # Wait for the model to be present before serving, so the first analyze
        # doesn't hit a missing-model error.
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:8080"   # http://localhost:5173 — 8080 = unprivileged nginx port
    depends_on:
      # Wait until the backend is healthy (HEALTHCHECK in backend/Dockerfile), not
      # merely started, so early proxied requests don't hit a cold/absent backend.
      backend:
        condition: service_healthy

volumes:
  pgdata:
  minio_data:
  ollama_data:
