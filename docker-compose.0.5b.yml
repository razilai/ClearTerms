# Override: run the stack on the tiny qwen2.5:0.5b model instead of the 4B
# default. Both the pulled model and the backend's agent_model/model_version
# must move together (mismatched agent_model without a model_version bump
# poisons the analysis cache — see app/core/config.py), so this file is the
# single point that flips all three.
#
#   docker compose -f docker-compose.yml -f docker-compose.0.5b.yml up
#
services:
  ollama-pull:
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:0.5b"]

  backend:
    environment:
      CLEARTERMS_AGENT_MODEL: qwen2.5:0.5b
      CLEARTERMS_MODEL_VERSION: qwen2.5-0.5b-v1
