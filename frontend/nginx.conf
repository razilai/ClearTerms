server {
    # 8080, not 80: the unprivileged nginx image runs as non-root and can't bind
    # a privileged port. Compose maps host 5173 → container 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1MB and 413s larger uploads before they reach the backend.
    # Match the backend's largest cap (max_video_bytes = 100MB in app/core/config.py)
    # so the backend stays the single authority on size — it enforces the real
    # per-type limits (image 10MB / video 100MB) and returns a clean domain error.
    client_max_body_size 100m;

    # Programmatic API calls: forward to the backend service. Mirrors the Vite
    # dev proxy (frontend/vite.config.ts) so prod behaves like dev. Media is NOT
    # here — the browser hits MinIO directly via presigned URLs (S3_PUBLIC_ENDPOINT).
    location ~ ^/(auth|forum|analyze|analyses|history|preferences) {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /analyze runs the LLM agent inline (queue.submit is stubbed) and Ollama
        # is CPU-bound in docker mode — a multi-chunk TOS can take minutes. nginx
        # defaults to 60s and 504s. Raise it so the request survives the agent.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback: deep links / refresh resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
