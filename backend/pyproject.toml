[project]
name = "clearterms-backend"
version = "0.1.0"
description = "ClearTerms backend — FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "pydantic-ai>=0.3",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
# The team's test files are named by kind (unit, integration, system, ...),
# which does not match pytest's default `test_*.py` discovery pattern.
python_files = ["unit.py", "integration.py", "system.py", "security.py", "stress.py"]
# tests/ is a package, so pytest puts the repo root on sys.path, not backend/.
# Pin backend/ explicitly (relative to rootdir) so `import app` does not depend
# on the editable install's .pth being honoured.
pythonpath = ["."]
# Tests needing a live Ollama are deselected by default: they take minutes.
# Run them with `uv run pytest -m slow`.
markers = ["slow: requires a live Ollama server"]
addopts = "-m 'not slow'"
